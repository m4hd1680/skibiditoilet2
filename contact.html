<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Skibidi Toilet</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- Poppins Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #1e1e21;
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }
    .form-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem;
      background-color: #2c2f36;
      border-radius: 10px;
    }
    .form-container input, .form-container textarea {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #333;
      color: #fff;
    }
    .form-container button {
      width: 100%;
      padding: 1rem;
      background-color: #4d4f57;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .form-container button:hover {
      background-color: #35363c;
    }
  </style>
</head>
<body class="bg-black text-white">

  <div class="flex justify-center items-center min-h-screen">
    <div class="form-container">
      <h2 class="text-3xl font-bold text-center mb-6">Contact Us</h2>

      <form action="submit_form.php" method="POST">
        <label for="name" class="text-lg">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email" class="text-lg">Your Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="message" class="text-lg">Your Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Write your message" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

</body>
</html>
